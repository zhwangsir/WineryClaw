<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>WeBrain - AI Agent Platform</title>
  <script>
    (function() {
      try {
        // StorageAdapter.set wraps values in JSON.stringify, so parse before comparing.
        var raw = localStorage.getItem("webrain-theme");
        var t = raw ? JSON.parse(raw) : null;
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* ignore parse errors, fall back to default dark */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
