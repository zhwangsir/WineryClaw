[package]
name = "webrain"
version = "0.1.0"
description = "WeBrain — 本地 AI 双脑平台"
authors = ["WeBrain Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["blocking"] }
sysinfo = "0.30"
tokio = { version = "1", features = ["time", "process", "rt-multi-thread"] }
dirs = "5"
