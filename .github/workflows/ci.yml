name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          # Production deps + pytest stack (pytest is intentionally NOT in
          # requirements.txt — that file is for runtime only). Without these
          # the CI "Run tests" step errors with `No module named pytest`.
          pip install -r sub-brain/main-brain/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Syntax check
        run: |
          python -m py_compile sub-brain/main-brain/main_brain.py
          python -m py_compile sub-brain/main-brain/memory/memory_manager.py
          python -m py_compile sub-brain/main-brain/chat/chat_engine.py
      - name: Run tests
        run: |
          cd sub-brain/main-brain && python -m pytest tests/ -q --tb=short --no-cov

  typescript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install sub-brain deps
        run: |
          cd sub-brain && pnpm install
      - name: Type check sub-brain
        run: |
          cd sub-brain && pnpm exec tsc --noEmit
      - name: Run sub-brain tests
        run: |
          cd sub-brain && pnpm test
      - name: Install frontend deps
        run: |
          cd frontend && pnpm install
      - name: Type check frontend
        run: |
          cd frontend && pnpm exec tsc --noEmit
      - name: Lint frontend
        run: |
          cd frontend && pnpm lint
      - name: Format check frontend
        run: |
          cd frontend && pnpm format
      - name: Run frontend tests
        run: |
          cd frontend && pnpm vitest run --coverage

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install frontend deps
        run: |
          cd frontend && pnpm install
      - name: Build frontend
        run: |
          cd frontend && pnpm build

  # `integration-test` exercises the umbrella vitest suite in `tests/`. Those
  # tests fetch sub-brain at :3000 (and main-brain via /brain/*). The job is
  # intentionally NOT spawning the backend stack — bootstrapping main-brain
  # (Python venv + sentence-transformers cold-load, ~500 MB pip + 30 s
  # startup) here would double CI time and duplicate what `e2e-boot-smoke`
  # already covers.
  #
  # v2.20: `tests/_run-or-skip.mjs` now does a preflight against /health and
  # exits 0 with a console.warn when WEBRAIN_REQUIRE_BACKEND≠1 and backend is
  # down. This converts "no backend in CI" into a clean green check while
  # preserving local strictness via `WEBRAIN_REQUIRE_BACKEND=1 pnpm test`.
  # `continue-on-error: true` therefore no longer needed.
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install root deps
        run: pnpm install
      - name: Install sub-brain deps
        run: cd sub-brain && pnpm install
      - name: Run integration tests (preflight skips if backend not spawned)
        run: pnpm test
        env:
          CI: true
          WEBRAIN_REQUIRE_BACKEND: "0"

  # ---------------------------------------------------------------------
  # E2E boot smoke (M-Smoke-1, 2026-05-20).
  # Spawns real main-brain (FastAPI/uvicorn) + sub-brain (Fastify/tsx) as
  # subprocesses, talks through the /brain/* proxy, asserts the wiring
  # invariants that unit tests can't cover (the bug class that the
  # 2026-05-20 user trial exposed). ~2 min total.
  #
  # Runs as a separate job so a smoke regression is visible in CI as
  # "smoke red, units green" — that's diagnostic by itself.
  # ---------------------------------------------------------------------
  e2e-boot-smoke:
    runs-on: ubuntu-latest
    needs: [python-check, typescript-check]  # don't smoke if basics fail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install main-brain deps (creates venv at expected path)
        run: |
          cd sub-brain/main-brain
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          # pytest is intentionally excluded from requirements.txt (production-only)
          # but the smoke step below invokes `pytest`, so install the test stack
          # into this venv too — matches what python-check (line 23) does. Missing
          # this install was the 2026-05-22 CI red: "No module named pytest".
          ./venv/bin/pip install pytest pytest-asyncio pytest-cov
      - name: Install sub-brain deps
        run: cd sub-brain && pnpm install
      - name: Run e2e boot smoke
        run: |
          cd sub-brain/main-brain
          ./venv/bin/python -m pytest -m smoke tests/smoke/ -s --no-cov --tb=short
        # v2.21: bumped from 5 → 15 min. The smoke spawns real backend services
        # per module-scoped fixture; on CI's cold VM sentence-transformers
        # download + torch first-import easily adds 60s vs warm local. Locally
        # the full smoke takes ~6 min, so 5 min was insufficient even when
        # nothing's wrong.
        timeout-minutes: 15

  # ---------------------------------------------------------------------
  # Linux desktop shell — Tauri 2.x cross-platform validation (v2.27).
  #
  # Why Linux specifically: macOS Tauri build is exercised locally by the
  # primary developer; Windows is documented as best-effort (no current
  # platform owner). Linux is the open-source target and the platform
  # other contributors will compile on. Without CI, any Linux-breaking
  # change (e.g. macOS-only API, missing #[cfg] guard) sneaks through.
  #
  # Strategy: cargo check + cargo test --lib on Ubuntu, with Tauri's
  # webview dependencies installed.
  #
  # v2.43 (Sprint 0.7 GA prep): the previous "cheap check only" stance has
  # been upgraded. ROADMAP V2 §4 lists "桌面壳可在 Linux 一键启动" as a
  # v2 completion criterion, and a `cargo check` alone has zero coverage
  # of the bundling pipeline (frontend dist → tauri bundle → .deb). We now
  # additionally run `tauri build --bundles deb` and verify the resulting
  # .deb package structure on PRs. ~3–5 min added; cargo cache keeps it
  # to <90s on warm runs. The smoke step intentionally does NOT launch
  # the binary (CI has no X server) — that gap is covered by macOS
  # manual QA + the e2e-boot-smoke job's spawn of the headless services.
  # ---------------------------------------------------------------------
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit dependencies
        # Tauri 2.x on Linux needs webkit2gtk-4.1, gtk-3, libayatana
        # (tray indicator), librsvg2 (SVG icon raster). Install via apt
        # before cargo — Tauri's build.rs probes for these via pkg-config
        # and fails fast if missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cargo check (desktop)
        run: |
          cd desktop/src-tauri
          cargo check --all-targets
      - name: Cargo test --lib (desktop)
        # Three unit tests in service_manager: augmented_path / log_dir /
        # port_in_use. None require X server or webkit runtime.
        run: |
          cd desktop/src-tauri
          cargo test --lib --no-fail-fast
      - name: Cargo fmt check
        run: |
          cd desktop/src-tauri
          cargo fmt --all -- --check
      - name: Cargo clippy
        run: |
          cd desktop/src-tauri
          cargo clippy --all-targets -- -D warnings
        timeout-minutes: 10

      # v2.43 — tauri build + .deb smoke. Splits into Node setup,
      # frontend build (Tauri's beforeBuildCommand runs `cd ../frontend
      # && pnpm build` — but we install deps explicitly here so the
      # build step doesn't double up), then the bundle, then structural
      # verification. Only the .deb bundle is produced (skips rpm /
      # appimage) — that's the most representative Linux artifact and
      # we don't want the job to balloon to 15 min.
      - name: Setup Node for frontend bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Install desktop deps
        run: cd desktop && pnpm install --frozen-lockfile
      - name: Tauri build (.deb only)
        # `tauri build --bundles deb` skips rpm / appimage. The frontend
        # build is triggered via Tauri's beforeBuildCommand
        # ("cd ../frontend && pnpm build"). --ci suppresses the
        # interactive update prompt that Tauri shows on stdout.
        run: cd desktop && pnpm tauri build --bundles deb --ci
        timeout-minutes: 15
      - name: Verify .deb structure (smoke)
        # The build produced exactly ONE deb under
        # target/release/bundle/deb/. We assert:
        #   1. file exists + filename starts with the productName
        #   2. dpkg-deb -I parses control metadata
        #   3. dpkg-deb -c lists the expected binary path
        #   4. extract the binary; verify it's ELF and `ldd` has no
        #      "not found" lines (catches missing runtime libs that
        #      would explode at user startup time)
        run: |
          set -euo pipefail
          DEB=$(ls desktop/src-tauri/target/release/bundle/deb/*.deb | head -n1)
          echo "Built .deb: $DEB"
          test -f "$DEB"
          dpkg-deb -I "$DEB"
          echo "--- contents ---"
          dpkg-deb -c "$DEB" | grep -E "usr/bin/(WeBrain|webrain)" \
            || (echo "expected WeBrain binary missing from .deb"; exit 1)
          mkdir -p /tmp/deb-extract
          dpkg-deb -x "$DEB" /tmp/deb-extract
          BIN=$(find /tmp/deb-extract/usr/bin -type f | head -n1)
          echo "Extracted binary: $BIN"
          file "$BIN" | grep -q "ELF" \
            || (echo "binary is not ELF"; exit 1)
          # ldd shows missing libs as "not found". A clean output has
          # none. We grep -v to strip the "linux-vdso" line which has
          # no path resolution.
          echo "--- ldd ---"
          ldd "$BIN" || true
          if ldd "$BIN" 2>&1 | grep -E "not found" >/dev/null; then
            echo "FATAL: .deb binary has unresolved shared library deps"
            ldd "$BIN" 2>&1 | grep -E "not found"
            exit 1
          fi
          echo "✓ .deb bundle smoke passed"
