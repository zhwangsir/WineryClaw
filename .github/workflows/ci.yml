name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          # Production deps + pytest stack (pytest is intentionally NOT in
          # requirements.txt — that file is for runtime only). Without these
          # the CI "Run tests" step errors with `No module named pytest`.
          pip install -r sub-brain/main-brain/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Syntax check
        run: |
          python -m py_compile sub-brain/main-brain/main_brain.py
          python -m py_compile sub-brain/main-brain/memory/memory_manager.py
          python -m py_compile sub-brain/main-brain/chat/chat_engine.py
      - name: Run tests
        run: |
          cd sub-brain/main-brain && python -m pytest tests/ -q --tb=short --no-cov

  typescript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install sub-brain deps
        run: |
          cd sub-brain && pnpm install
      - name: Type check sub-brain
        run: |
          cd sub-brain && pnpm exec tsc --noEmit
      - name: Run sub-brain tests
        run: |
          cd sub-brain && pnpm test
      - name: Install frontend deps
        run: |
          cd frontend && pnpm install
      - name: Type check frontend
        run: |
          cd frontend && pnpm exec tsc --noEmit
      - name: Lint frontend
        run: |
          cd frontend && pnpm lint
      - name: Format check frontend
        run: |
          cd frontend && pnpm format
      - name: Run frontend tests
        run: |
          cd frontend && pnpm vitest run --coverage

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install frontend deps
        run: |
          cd frontend && pnpm install
      - name: Build frontend
        run: |
          cd frontend && pnpm build

  # `integration-test` exercises the umbrella vitest suite in `tests/`. Those
  # tests fetch sub-brain at :3000 (and main-brain via /brain/*). The job is
  # intentionally NOT spawning the backend stack — bootstrapping main-brain
  # (Python venv + sentence-transformers cold-load, ~500 MB pip + 30 s
  # startup) here would double CI time and duplicate what `e2e-boot-smoke`
  # already covers.
  #
  # v2.20: `tests/_run-or-skip.mjs` now does a preflight against /health and
  # exits 0 with a console.warn when WEBRAIN_REQUIRE_BACKEND≠1 and backend is
  # down. This converts "no backend in CI" into a clean green check while
  # preserving local strictness via `WEBRAIN_REQUIRE_BACKEND=1 pnpm test`.
  # `continue-on-error: true` therefore no longer needed.
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install root deps
        run: pnpm install
      - name: Install sub-brain deps
        run: cd sub-brain && pnpm install
      - name: Run integration tests (preflight skips if backend not spawned)
        run: pnpm test
        env:
          CI: true
          WEBRAIN_REQUIRE_BACKEND: "0"

  # ---------------------------------------------------------------------
  # E2E boot smoke (M-Smoke-1, 2026-05-20).
  # Spawns real main-brain (FastAPI/uvicorn) + sub-brain (Fastify/tsx) as
  # subprocesses, talks through the /brain/* proxy, asserts the wiring
  # invariants that unit tests can't cover (the bug class that the
  # 2026-05-20 user trial exposed). ~2 min total.
  #
  # Runs as a separate job so a smoke regression is visible in CI as
  # "smoke red, units green" — that's diagnostic by itself.
  # ---------------------------------------------------------------------
  e2e-boot-smoke:
    runs-on: ubuntu-latest
    needs: [python-check, typescript-check]  # don't smoke if basics fail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install main-brain deps (creates venv at expected path)
        run: |
          cd sub-brain/main-brain
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          # pytest is intentionally excluded from requirements.txt (production-only)
          # but the smoke step below invokes `pytest`, so install the test stack
          # into this venv too — matches what python-check (line 23) does. Missing
          # this install was the 2026-05-22 CI red: "No module named pytest".
          ./venv/bin/pip install pytest pytest-asyncio pytest-cov
      - name: Install sub-brain deps
        run: cd sub-brain && pnpm install
      - name: Run e2e boot smoke
        run: |
          cd sub-brain/main-brain
          ./venv/bin/python -m pytest -m smoke tests/smoke/ -s --no-cov --tb=short
        timeout-minutes: 5
